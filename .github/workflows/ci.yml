name: build-and-lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Lint frontend (ESLint)
        working-directory: client
        run: npm run lint

      - name: Format check frontend (Prettier)
        working-directory: client
        run: npm run format:check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: server
        run: pip install -r requirements-dev.txt

      - name: Lint backend (Ruff)
        working-directory: server
        run: ruff check .

      - name: Format check backend (Ruff)
        working-directory: server
        run: ruff format --check .

      - name: Build backend Docker image
        run: docker build -t backend ./server

      - name: Build frontend Docker image
        run: docker build -t frontend ./client --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000/api
